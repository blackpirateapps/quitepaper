[package]
name = "quietpaper_cli"
version = "1.6.4"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "qp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
jiff = "0.2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
