<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiet Paper — Sync API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F7F6F2;
      color: #292824;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #FBFAF7;
      border: 1px solid #E8E5DF;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p {
      color: #77736C;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 20px 0;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #ECE9E3;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #6F9275;
      margin-bottom: 24px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6F9275;
    }
    .links a {
      color: #D65F55;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status"><span class="dot"></span> Backend API Operational</div>
    <h1>Quiet Paper Sync Service</h1>
    <p>Zero-knowledge end-to-end encrypted synchronization server powered by Vercel Serverless and Turso libSQL.</p>
    <div class="links">
      <a href="/api/v1/health">Check API Health &rarr;</a>
    </div>
  </div>
</body>
</html>
