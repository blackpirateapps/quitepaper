[advisories]
version = 2

[licenses]
private = { ignore = true }
version = 2
allow = ["MIT", "Apache-2.0", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]
confidence-threshold = 0.8

# Permissive dependencies used for deterministic tag IDs and constant-time crypto.
[[licenses.exceptions]]
name = "sha1_smol"
allow = ["BSD-3-Clause"]
[[licenses.exceptions]]
name = "subtle"
allow = ["BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# allo-isolate 0.1.27 omits manifest metadata; its shipped LICENSE is Apache 2.0.
[[licenses.clarify]]
name = "allo-isolate"
version = "0.1.27"
expression = "Apache-2.0"
license-files = [{path = "LICENSE", hash = 0xa6d4ed6}]
