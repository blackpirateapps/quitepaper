app-id: com.blackpiratex.quietpaper
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: quitepaper

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: quietpaper
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/256x256/apps /app/share/icons/hicolor/512x512/apps
      - cp -a bundle/* /app/bin/
      - chmod +x /app/bin/quitepaper
      - install -Dm644 com.blackpiratex.quietpaper.desktop /app/share/applications/com.blackpiratex.quietpaper.desktop
      - install -Dm644 com.blackpiratex.quietpaper.metainfo.xml /app/share/metainfo/com.blackpiratex.quietpaper.metainfo.xml
      - install -Dm644 icon_256.png /app/share/icons/hicolor/256x256/apps/com.blackpiratex.quietpaper.png
      - install -Dm644 icon_512.png /app/share/icons/hicolor/512x512/apps/com.blackpiratex.quietpaper.png
    sources:
      - type: dir
        path: flatpak-staging
