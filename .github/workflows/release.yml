name: Build & Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0 - leave empty to use pubspec.yaml version)'
        required: false
        type: string
      release_title:
        description: 'Release Title (leave empty to use default)'
        required: false
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version from pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUMBER=$(git rev-list --count HEAD)
          
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$VERSION_NAME"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if [ -n "${{ inputs.release_title }}" ]; then
            TITLE="${{ inputs.release_title }}"
          else
            TITLE="Quiet Paper v$VERSION_NAME"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

  build-android:
    name: Build Android APKs
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Keystore from Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | flutter doctor --android-licenses || true

      - name: Build Split-Per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --flavor github --split-per-abi --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"

      - name: Build Universal APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --flavor github --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"

      - name: Organize & Name Release APKs
        run: |
          mkdir -p release-apks
          V="${{ needs.prepare.outputs.version }}"

          # Locate and copy architecture-specific APKs
          ARM64_APK=$(find build/app/outputs/flutter-apk -name "*arm64-v8a*.apk" | head -n 1)
          ARMEABI_APK=$(find build/app/outputs/flutter-apk -name "*armeabi-v7a*.apk" | head -n 1)
          X86_64_APK=$(find build/app/outputs/flutter-apk -name "*x86_64*.apk" | head -n 1)
          UNIVERSAL_APK=$(find build/app/outputs/flutter-apk -maxdepth 1 -name "*release.apk" ! -name "*v8a*" ! -name "*v7a*" ! -name "*x86*" | head -n 1)

          cp "$ARM64_APK" release-apks/quiet-paper-${V}-arm64-v8a.apk
          cp "$ARMEABI_APK" release-apks/quiet-paper-${V}-armeabi-v7a.apk
          cp "$X86_64_APK" release-apks/quiet-paper-${V}-x86_64.apk
          cp "$UNIVERSAL_APK" release-apks/quiet-paper-${V}-universal.apk

          echo "Generated APKs:"
          ls -la release-apks/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-apks
          path: release-apks/*.apk
          retention-days: 7

  build-linux:
    name: Build Linux Packages (RPM, DEB, AppImage, Tarball)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav rpm curl file dpkg

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux Release Bundle
        run: |
          flutter build linux --release \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"

      - name: Package Linux Release Tarball
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p dist/tarball/quitepaper
          cp -a build/linux/x64/release/bundle/* dist/tarball/quitepaper/
          mkdir -p dist/tarball/quitepaper/share/applications
          mkdir -p dist/tarball/quitepaper/share/metainfo
          mkdir -p dist/tarball/quitepaper/share/icons/hicolor/256x256/apps
          mkdir -p dist/tarball/quitepaper/share/icons/hicolor/512x512/apps
          cp linux/com.blackpiratex.quietpaper.desktop dist/tarball/quitepaper/share/applications/
          cp linux/com.blackpiratex.quietpaper.metainfo.xml dist/tarball/quitepaper/share/metainfo/
          cp linux/assets/icon.png dist/tarball/quitepaper/share/icons/hicolor/256x256/apps/com.blackpiratex.quietpaper.png
          cp assets/icons/app_icon.png dist/tarball/quitepaper/share/icons/hicolor/512x512/apps/com.blackpiratex.quietpaper.png
          tar -czvf "quiet-paper-${V}-linux-x64.tar.gz" -C dist/tarball quitepaper

      - name: Build RPM Package
        run: |
          V="${{ needs.prepare.outputs.version }}"
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb linux/packaging/quietpaper.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "_sourcedir $PWD" \
            --define "app_version $V"
          RPM_FILE=$(find rpmbuild/RPMS -name "*.rpm" | head -n 1)
          cp "$RPM_FILE" "quiet-paper-${V}-1.x86_64.rpm"

      - name: Build DEB Package
        run: |
          chmod +x linux/packaging/build_deb.sh
          ./linux/packaging/build_deb.sh "${{ needs.prepare.outputs.version }}"
          cp "build/linux/dist/quiet-paper-${{ needs.prepare.outputs.version }}-amd64.deb" .

      - name: Build AppImage Package
        run: |
          chmod +x linux/packaging/build_appimage.sh
          ./linux/packaging/build_appimage.sh "${{ needs.prepare.outputs.version }}"
          cp "build/linux/dist/Quiet_Paper-${{ needs.prepare.outputs.version }}-x86_64.AppImage" .

      - name: Organize Linux Release Artifacts
        run: |
          mkdir -p release-linux
          V="${{ needs.prepare.outputs.version }}"
          cp "quiet-paper-${V}-linux-x64.tar.gz" release-linux/
          cp "quiet-paper-${V}-1.x86_64.rpm" release-linux/
          cp "quiet-paper-${V}-amd64.deb" release-linux/
          cp "Quiet_Paper-${V}-x86_64.AppImage" release-linux/
          echo "Generated Linux packages:"
          ls -la release-linux/

      - name: Upload Linux Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-linux-packages
          path: release-linux/*
          retention-days: 7

      - name: Prepare Flatpak Staging Directory
        run: |
          chmod +x linux/packaging/build_flatpak.sh
          ./linux/packaging/build_flatpak.sh "${{ needs.prepare.outputs.version }}"

      - name: Upload Flatpak Staging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-staging-bundle
          path: linux/packaging/flatpak-staging
          retention-days: 1

  build-flatpak:
    name: Build Flatpak Package
    needs: [prepare, build-linux]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flatpak Staging Artifact
        uses: actions/download-artifact@v4
        with:
          name: flatpak-staging-bundle
          path: linux/packaging/flatpak-staging

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: quiet-paper-${{ needs.prepare.outputs.version }}-x86_64.flatpak
          manifest-path: linux/packaging/com.blackpiratex.quietpaper.yml
          cache: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-flatpak
          path: quiet-paper-${{ needs.prepare.outputs.version }}-x86_64.flatpak
          retention-days: 7

  publish-release:
    name: Create GitHub Release and Upload Assets
    needs: [prepare, build-android, build-linux, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quiet-paper-apks
          path: release-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quiet-paper-linux-packages
          path: release-assets

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4
        with:
          name: quiet-paper-flatpak
          path: release-assets

      - name: List Release Assets
        run: |
          echo "All assets gathered for release:"
          ls -la release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
