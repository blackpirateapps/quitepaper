name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Setup Keystore from Repository Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Extract App Version from pubspec.yaml
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Split-Per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --split-per-abi --release

      - name: Build Universal APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Organize & Name Release APKs
        run: |
          mkdir -p release-artifacts
          V="${{ steps.version.outputs.version }}"

          # Copy and rename architecture-specific APKs
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/quiet-paper-${V}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/quiet-paper-${V}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/quiet-paper-${V}-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/quiet-paper-${V}-universal.apk

          echo "Generated APKs:"
          ls -la release-artifacts/

      - name: Upload arm64-v8a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-${{ steps.version.outputs.version }}-arm64-v8a
          path: release-artifacts/quiet-paper-${{ steps.version.outputs.version }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-${{ steps.version.outputs.version }}-armeabi-v7a
          path: release-artifacts/quiet-paper-${{ steps.version.outputs.version }}-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-${{ steps.version.outputs.version }}-x86_64
          path: release-artifacts/quiet-paper-${{ steps.version.outputs.version }}-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-${{ steps.version.outputs.version }}-universal
          path: release-artifacts/quiet-paper-${{ steps.version.outputs.version }}-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload All APKs bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-${{ steps.version.outputs.version }}-all-apks
          path: release-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
