name: Build Android AAB (Play Store)

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version Name override (e.g. 1.5.8 - leave empty to use pubspec.yaml)'
        required: false
        type: string
      build_number:
        description: 'Version Code / Build Number override (e.g. 16 - leave empty to use pubspec.yaml)'
        required: false
        type: string

jobs:
  build-aab:
    name: Build Android App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version and Build Number
        id: version
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          DEFAULT_VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          DEFAULT_BUILD_NUMBER=$(echo "$RAW_VERSION" | cut -d'+' -f2)

          VERSION_NAME="${{ inputs.build_name }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="$DEFAULT_VERSION_NAME"
          fi

          BUILD_NUMBER="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$DEFAULT_BUILD_NUMBER"
          fi

          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION_NAME, build number: $BUILD_NUMBER"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test

      - name: Setup Keystore from Secrets
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Accept Android SDK & NDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          yes | flutter doctor --android-licenses || true

      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && 'upload-keystore.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --flavor play --release \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Organize & Verify Release AAB Artifacts
        run: |
          mkdir -p release-artifacts
          V="${{ steps.version.outputs.version }}"
          B="${{ steps.version.outputs.build_number }}"

          # Locate generated AAB bundle
          if [ -f build/app/outputs/bundle/playRelease/app-play-release.aab ]; then
            cp build/app/outputs/bundle/playRelease/app-play-release.aab release-artifacts/quiet-paper-v${V}+${B}.aab
          else
            AAB_FILE=$(find build/app/outputs/bundle -name "*.aab" | head -n 1)
            if [ -n "$AAB_FILE" ]; then
              cp "$AAB_FILE" release-artifacts/quiet-paper-v${V}+${B}.aab
            else
              echo "Error: No AAB file found in build/app/outputs/bundle"
              exit 1
            fi
          fi

          # Preserve ProGuard / R8 mapping file if generated
          MAPPING_FILE=$(find build/app/outputs/mapping -name "mapping.txt" | head -n 1)
          if [ -n "$MAPPING_FILE" ]; then
            cp "$MAPPING_FILE" release-artifacts/mapping.txt
            echo "Preserved ProGuard / R8 mapping.txt for Play Store crash deobfuscation."
          fi

          echo "Generated Play Store Release Artifacts:"
          ls -lh release-artifacts/

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiet-paper-v${{ steps.version.outputs.version }}+${{ steps.version.outputs.build_number }}-aab
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 60
