name: Set up Linux watched-import Rust toolchain
description: Pinned Rust, Cargo cache and optional deterministic FRB generator
inputs:
  codegen:
    description: Install bridge generation tools
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      shell: bash
      run: rustup show active-toolchain && rustup component add rustfmt clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: watched-linux-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
    - name: Install pinned bridge tools
      if: inputs.codegen == 'true'
      shell: bash
      run: |
        scripts/install_frb_codegen.sh "$HOME/.cargo/bin"
        cargo install cargo-expand --version 1.0.127 --locked --jobs 2
